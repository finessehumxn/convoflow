name: deploy
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA to deploy. Leave empty for the current commit.
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      AWS_REGION: us-east-1
      CLUSTER: convoflow
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        if: inputs.image_tag == ''
        run: |
          docker build -t "${{ steps.ecr.outputs.registry }}/convoflow:$IMAGE_TAG" .
          docker push "${{ steps.ecr.outputs.registry }}/convoflow:$IMAGE_TAG"
      - name: Run migrations and deploy
        run: bash deploy.sh
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/convoflow:${{ env.IMAGE_TAG }}
          SUBNETS: ${{ vars.TASK_SUBNETS }}
          SECURITY_GROUP: ${{ vars.TASK_SECURITY_GROUP }}
          ASSIGN_PUBLIC_IP: ${{ vars.ASSIGN_PUBLIC_IP }}
